<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Sistema Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .login-card h3 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .btn-primary {
            width: 100%;
            background: #667eea;
            border: none;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }

        .feedback {
            text-align: center;
            margin-top: 15px;
        }

        .feedback.text-danger {
            color: #e53e3e;
        }

        .feedback.text-success {
            color: #38a169;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3>Ingreso al Sistema</h3>
    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label>Usuario</label>
            <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required/>
        </div>

        <div class="mb-3">
            <label>Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required/>
        </div>

        <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>

    <div th:if="${param.error}" class="feedback text-danger">
        Usuario o contraseña incorrectos
    </div>

    <div th:if="${param.logout}" class="feedback text-success">
        Sesión cerrada correctamente
    </div>
</div>

</body>
</html>
