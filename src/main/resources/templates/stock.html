<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Stock SAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="container container-dashboard">

    <h2 class="mb-4">Dashboard Inventario</h2>

    <!-- Cards -->
    <div class="row g-3 mb-4">
        <!-- Total Materiales -->
        <div class="col-md-3">
            <div class="card-widget card-primary">
                <i class="bi bi-box-seam icon"></i>
                <div>
                    <h6>Total Materiales</h6>
                    <h3 th:text="${totalMateriales}"></h3>
                </div>
            </div>
        </div>

        <!-- Materiales Bajo Mínimo -->
        <div class="col-md-3">
            <div class="card-widget card-danger">
                <i class="bi bi-exclamation-triangle icon"></i>
                <div>
                    <h6>Materiales Bajo Mínimo</h6>
                    <h3 th:text="${totalAlertas}"></h3>
                </div>
            </div>
        </div>

        <!-- Valor Total Inventario -->
        <div class="col-md-3">
            <div class="card-widget card-success">
                <i class="bi bi-currency-dollar icon"></i>
                <div>
                    <h6>Valor Total Inventario</h6>
                    <h5 th:text="${valorTotalInventario}"></h5>
                </div>
            </div>
        </div>

        <!-- Botón Sincronizar -->
        <div class="col-md-3 d-flex align-items-stretch">
            <button id="btn-sync" class="btn btn-dark w-100">
                <i class="bi bi-arrow-clockwise me-2"></i> Sincronizar Tabla
            </button>
        </div>
    </div>

    <!-- Filtros -->
    <form method="get" th:action="@{/}" class="row g-3 mb-4 filters">
        <div class="col-md-3">
            <input type="text" name="centro" class="form-control" placeholder="Área (Ej: IN01)" th:value="${centroSeleccionado}">
        </div>

        <div class="col-md-3">
            <input type="text" name="almacen" class="form-control" placeholder="Almacén (Ej: 1014)" th:value="${almacenSeleccionado}">
        </div>

        <div class="col-md-3 position-relative">
            <div class="custom-dropdown">
                <div class="custom-dropdown-display" id="areaDisplay">
                    <span th:text="${areaSeleccionada != null ? areaSeleccionada : 'Todas las áreas'}"></span>
                    <i class="bi bi-caret-down-fill"></i>
                </div>
                <ul class="custom-dropdown-options" id="areaOptions">
                    <li th:each="a : ${areasDisponibles}" 
                        th:text="${a}" 
                        th:data-value="${a}" 
                        th:classappend="${a == areaSeleccionada} ? 'selected' : ''">
                    </li>
                    <li data-value="" th:if="${areaSeleccionada == null}" class="selected">Todas las áreas</li>
                </ul>
                <input type="hidden" name="area" id="areaInput" th:value="${areaSeleccionada}">
            </div>
        </div>
        <div class="col-md-3 position-relative">
            <input type="text" name="buscar" id="buscador" class="form-control" placeholder="Buscar material o descripción" th:value="${buscar}">
        </div>

        <div class="col-md-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">Filtrar</button>
            <a th:href="@{/alertas}" class="btn btn-danger flex-fill">Ver Alertas</a>
        </div>
    </form>

    <!-- Contenedor de tabla -->
    <div id="tabla-container" th:replace="~{fragments/tabla :: tablaFragment}"></div>

</div>

<script th:src="@{/js/stock.js}"></script>
</body>
</html>
